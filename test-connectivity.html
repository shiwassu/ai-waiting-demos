<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新闻源连通性测试</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font-family:monospace; padding:30px; }
  h2 { color:#58a6ff; }
  .ok { color:#3fb950; } .fail { color:#f85149; } .pending { color:#d2991d; }
  pre { background:#161b22; padding:12px; border-radius:8px; overflow-x:auto; font-size:11px; white-space:pre-wrap; }
  button { padding:10px 24px; border-radius:8px; border:1px solid #30363d; background:#1c2333; color:#c9d1d9; cursor:pointer; font-size:14px; margin:4px; }
  button:hover { border-color:#58a6ff; color:#58a6ff; }
</style>
</head>
<body>
<h2>新闻源连通性测试</h2>
<p>此页面独立测试每个数据源的 JSONP 连通性</p>

<button onclick="testSina()">测试 新浪财经 JSONP</button>
<button onclick="testRss2Json()">测试 rss2json JSONP</button>
<button onclick="testFetch('https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/topics/CAAqJggKIiBDQkFTRWdvSUwyMHZNRGx6TVdZU0FtVnVHZ0pWVXlnQVAB?hl=zh-CN&gl=CN&ceid=CN:zh-Hans')">测试 rss2json fetch (CORS)</button>
<button onclick="testFetch('https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2509&k=&num=5&page=1')">测试 新浪 fetch (CORS)</button>
<button onclick="clearLog()">清空日志</button>

<div id="log"></div>

<script>
const logEl = document.getElementById('log');

function log(msg, cls='') {
  const div = document.createElement('div');
  div.innerHTML = `<span class="${cls}">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
  logEl.appendChild(div);
}

function clearLog(){ logEl.innerHTML=''; }

// JSONP 测试
function testJSONP(url, label){
  return new Promise((resolve) => {
    const cb = '_test_' + Math.random().toString(36).slice(2,8);
    const timer = setTimeout(()=>{ cleanup(); log(`❌ ${label}: 超时 (8秒)`, 'fail'); resolve(false); }, 8000);

    window[cb] = function(data){
      clearTimeout(timer);
      cleanup();
      const count = data?.items?.length || data?.result?.data?.length || 0;
      log(`✅ ${label}: 成功! 获取到 <b>${count}</b> 条 <span style="color:#3fb950">→ JSONP 可用</span>`, 'ok');
      if(count>0){
        const items = data.items || data.result.data;
        items.slice(0,2).forEach(i=>log(`  📰 ${(i.title||'').slice(0,60)}`, ''));
      }
      resolve(true);
    };

    const sep = url.includes('?') ? '&' : '?';
    const script = document.createElement('script');
    script.src = url + sep + 'callback=' + cb;
    script.onerror = ()=>{ clearTimeout(timer); cleanup(); log(`❌ ${label}: 网络错误 (script加载失败)`, 'fail'); resolve(false); };
    document.head.appendChild(script);

    function cleanup(){
      delete window[cb];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
  });
}

// fetch 测试
async function testFetch(url){
  log(`⏳ fetch: ${url.slice(0,60)}...`, 'pending');
  try{
    const resp = await fetch(url);
    if(!resp.ok){ log(`❌ fetch HTTP ${resp.status}`, 'fail'); return; }
    const data = await resp.json();
    const count = data?.items?.length || data?.result?.data?.length || 0;
    log(`✅ fetch 成功: ${count} 条 <span style="color:#3fb950">→ CORS 头正常</span>`, 'ok');
  }catch(e){
    log(`❌ fetch 失败: ${e.message} <span style="color:#f85149">→ 被 CORS 拦截</span>`, 'fail');
  }
}

async function testSina(){
  log('⏳ 测试新浪财经 JSONP...', 'pending');
  await testJSONP('https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2509&k=&num=10&page=1&r='+Date.now(), '新浪财经');
}

async function testRss2Json(){
  log('⏳ 测试 rss2json JSONP...', 'pending');
  const rss = 'https://news.google.com/rss/topics/CAAqJggKIiBDQkFTRWdvSUwyMHZNRGx6TVdZU0FtVnVHZ0pWVXlnQVAB?hl=zh-CN&gl=CN&ceid=CN:zh-Hans';
  await testJSONP('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss), 'rss2json');
}

// 自动跑一轮
setTimeout(()=>{ log('=== 自动测试开始 ===', 'pending'); testSina().then(()=>testRss2Json()); }, 500);
</script>
</body>
</html>
